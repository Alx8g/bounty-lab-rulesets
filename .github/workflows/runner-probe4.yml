name: runner-probe4
on:
  push:
    paths: ['.github/workflows/runner-probe4.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          id > out.txt
          ls /var/run/docker.sock >> out.txt 2>&1
          getent hosts ssrf-target.iad.github.net >> out.txt 2>&1 || echo "ssrf-target nxdomain" >> out.txt
          getent hosts files.github.net >> out.txt 2>&1 || echo "files.github.net nxdomain" >> out.txt
          curl -s -m 3 -o meta.txt -w "%{http_code}" http://169.254.169.254/metadata/instance >> out.txt 2>&1
          cat out.txt
