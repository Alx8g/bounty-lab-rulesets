name: workflow-run-cascade-probe
on:
  workflow_run:
    workflows: ["cache-pr-rw-probe"]
    types: [completed]

jobs:
  cascade:
    runs-on: ubuntu-latest
    steps:
      - name: secrets and untrusted code in same job
        run: |
          echo "secrets present: ${{ secrets.CANARY_SECRET != '' }}"
          git init -q .
          git remote add origin "https://github.com/${{ github.event.workflow_run.head_repository.full_name }}"
          git fetch -q --depth=1 origin "${{ github.event.workflow_run.head_sha }}"
          git checkout -q FETCH_HEAD
          echo "=== untrusted code now executing ==="
          ls -la
          cat PROBE.md
          echo "=== can secret be read by untrusted code? ==="
          echo "len=$(#echo -n ${{ secrets.CANARY_SECRET }} | wc -c)"
