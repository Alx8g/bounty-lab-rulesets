name: workflow-run-cascade-probe
on:
  workflow_run:
    workflows: ["cache-pr-rw-probe"]
    types: [completed]

jobs:
  cascade:
    runs-on: ubuntu-latest
    steps:
      - name: report secrets + cache write
        run: |
          echo "secrets present: ${{ secrets.CANARY_SECRET != '' }}"
          mkdir -p casc
          echo "cascade-marker" > casc/m.txt
      - uses: actions/cache@v4
        id: c
        with:
          path: ./casc
          key: cascade-write-${{ github.run_id }}
      - name: save verdict
        run: echo "cache write attempted from workflow_run on default branch"
