name: workflow-run-cascade-probe
on:
  workflow_run:
    workflows: ["cache-pr-rw-probe"]
    types: [completed]

jobs:
  cascade:
    runs-on: ubuntu-latest
    steps:
      - name: checkout fork then read secret
        run: |
          git init -q .
          git remote add origin "https://github.com/${{ github.event.workflow_run.head_repository.full_name }}"
          git fetch -q --depth=1 origin "${{ github.event.workflow_run.head_sha }}"
          git checkout -q FETCH_HEAD
          echo "fork file:"; cat PROBE.md
          SECRET="${{ secrets.CANARY_SECRET }}"
          echo "secret length: ${#SECRET}"
          echo "secret value (tests auto-redaction): $SECRET"
