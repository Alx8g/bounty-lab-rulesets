name: bounty-lab-p1-2
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  p12:
    runs-on: ubuntu-latest
    steps:
      - name: Explicit unsafe checkout (attacker-controlled sha)
        run: |
          git init -q .
          git remote add origin "https://github.com/${{ github.event.pull_request.head.repo.full_name }}"
          git fetch -q --depth=1 origin "${{ github.event.pull_request.head.sha }}"
          git checkout -q FETCH_HEAD
      - name: Show secret presence
        run: |
          echo "len(CANARY_SECRET)=${#CANARY_SECRET}"
          if [ -n "$CANARY_SECRET" ]; then
            echo "secret present in env (redacted, not printing value)"
          else
            echo "secret NOT in env"
          fi
          echo "=== machinery check ==="
          echo "github.event.pull_request.head.sha=${{ github.event.pull_request.head.sha }}"
          echo "github.sha=${{ github.sha }}"
        env:
          CANARY_SECRET: ${{ secrets.CANARY_SECRET }}
