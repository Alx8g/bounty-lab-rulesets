name: cache-pr-rw-probe
on:
  pull_request:

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        id: c
        with:
          path: ./pdir
          key: pr-scope-${{ github.event.pull_request.head.sha }}
      - run: |
          mkdir -p pdir
          echo "pr-rw-marker-${{ github.run_id }}" > pdir/m.txt
